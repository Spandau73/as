<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S-PORTAL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .container {
    max-width: 800px;
    width: 100%;
  }

  /* Header */
  header {
    text-align: center;
    padding: 20px 0;
  }
  .header-img {
    width: 100%;
    max-width: 500px;
    border-radius: 16px;
    margin-bottom: 15px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #E50914;
    text-transform: uppercase;
  }

  /* Section title */
  .section-title {
    font-size: 18px;
    font-weight: 600;
    color: #aaa;
    padding: 10px 0;
    border-bottom: 1px solid #222;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 30px;
  }

  /* Cards */
  .card {
    background: #111;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid #222;
    text-decoration: none;
    color: #fff;
    display: block;
  }
  .card:hover, .card:active {
    background: #1a1a1a;
    border-color: #444;
    transform: scale(0.97);
  }
  .card .icon-img {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: inline-block;
    object-fit: cover;
  }
  /* Fullscreen button */
  .fullscreen-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    margin: 20px 0;
    transition: 0.2s;
  }
  .fullscreen-btn:hover, .fullscreen-btn:active {
    background: #222;
    border-color: #555;
  }

  /* Footer */
  footer {
    text-align: center;
    color: #444;
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
